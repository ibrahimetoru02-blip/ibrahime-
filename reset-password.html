<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Reset password — StevePics Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-admin">
    <main class="admin-main container">
      <section class="admin-login-panel" aria-labelledby="reset-title">
        <div class="admin-panel-icon" aria-hidden="true">🔒</div>
        <h1 id="reset-title">Set a new password</h1>
        <p id="reset-status" class="form-message" aria-live="polite">Checking your secure reset link…</p>
        <form id="reset-password-form" class="admin-login-form" hidden>
          <label for="new-password">New password</label>
          <input
            id="new-password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="12"
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{12,}"
            title="Use at least 12 characters, including uppercase and lowercase letters, a number, and a symbol."
            required
          />
          <label for="confirm-password">Confirm new password</label>
          <input
            id="confirm-password"
            name="confirm-password"
            type="password"
            autocomplete="new-password"
            minlength="12"
            required
          />
          <button class="btn btn-primary" type="submit">Update password</button>
        </form>
        <a class="btn btn-secondary reset-back-link" href="admin.html">Return to admin sign in</a>
      </section>
    </main>
    <script src="supabase-config.js"></script>
    <script src="reset-password.js"></script>
  </body>
</html>
